<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ことば帳" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <title>ことば帳 - 言えそうで言えない英単語</title>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        if (!('serviceWorker' in navigator) || window.location.protocol !== 'https:') {
          return;
        }

        // After a new SW claims the page, reload once so the fresh index.html loads.
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        navigator.serviceWorker.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'KOTOBACHO_SW_ACTIVATED' && !refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', function () {
          // Purge any legacy Cache Storage left by kotobacho-v1 cache-first SW.
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              return Promise.all(
                keys
                  .filter(function (key) {
                    return key === 'kotobacho-v1' || key.indexOf('kotobacho-v2') === 0;
                  })
                  .map(function (key) {
                    return caches.delete(key);
                  })
              );
            }).catch(function () {});
          }

          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              // Check for SW updates on every load.
              reg.update().catch(function () {});
            })
            .catch(function (err) {
              console.log('Service worker registration failed:', err);
            });
        });
      })();
    </script>
  </body>
</html>
